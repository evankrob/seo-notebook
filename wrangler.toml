# Defaults for a fresh deploy (Deploy to Cloudflare button or `npm run deploy`) and for local dev.
# Resources have no IDs here: Wrangler provisions the D1 database, R2 bucket and queue on first deploy.
# Running your own long-lived production? Keep its IDs and Access values out of git in
# wrangler.production.toml (see wrangler.production.toml.example) and deploy with
#   npx wrangler deploy -c wrangler.production.toml
name = "seo-notebook"
main = "apps/api/src/index.ts"
compatibility_date = "2025-10-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Preview URLs (<version>-seo-notebook.*.workers.dev) are not covered by your Access application.
preview_urls = false

[assets]
directory = "./apps/web"
binding = "ASSETS"
run_worker_first = true

[vars]
CONNECTOR_MODE = "mock"
# Cloudflare Access identifies humans. Both empty = local mode: only loopback requests are let in
# (acting as LOCAL_USER_EMAIL, default owner@localhost); a deployed notebook shows a setup page.
# ACCESS_TEAM_DOMAIN: e.g. yourteam.cloudflareaccess.com
# ACCESS_AUD: the Access application's "Application Audience (AUD) Tag"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Secret (not a var): GOOGLE_SERVICE_ACCOUNT, the Google service-account JSON key.
#   npx wrangler secret put GOOGLE_SERVICE_ACCOUNT < service-account.json

[[d1_databases]]
binding = "DB"
database_name = "seo-notebook"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "seo-notebook-uploads"

[[queues.producers]]
binding = "JOBS"
queue = "seo-notebook-jobs"

[[queues.consumers]]
queue = "seo-notebook-jobs"
max_batch_size = 10
max_retries = 3

[triggers]
crons = ["0 7 * * *"]
